# dsh-remind bundle patch.
#
# This file is the `dsh.bundle.patch` layer of the published package: when the
# plugin is installed through the official CLI —
#
#   dsh plugin --profile <name> add dsh-remind
#
# — the command reconciles `dsh.profile.bundles` against installed packages
# and, seeing this declaration, appends `dsh-remind` to the bundle
# stack. The profile boot then merges THIS patch (a single `insert` of the
# plugin row) exactly like a manual cordis.patch.yml mount line. No profile
# file edits needed — one command installs and mounts.
- insert:
    - id: tool-remind
      name: 'dsh-remind'
      config:
        maxResults: 25
        maxCharsPerEvent: 20000
